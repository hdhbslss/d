<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我喜歡你 ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #fff0f5 0%, #ffe4e9 100%);
            font-family: 'Segoe UI', 'Helvetica Neue', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            overflow-x: hidden;
            position: relative;
        }

        /* 飄浮愛心背景 */
        .heart-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .heart-bg span {
            position: absolute;
            color: rgba(255, 120, 150, 0.25);
            animation: floatHeart linear infinite;
            user-select: none;
        }

        @keyframes floatHeart {
            0% {
                transform: translateY(110vh) rotate(0deg) scale(0.8);
                opacity: 0.2;
            }
            100% {
                transform: translateY(-20vh) rotate(360deg) scale(1.2);
                opacity: 0.7;
            }
        }

        /* 主卡片 */
        .card {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 2.8rem 2.2rem;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 25px 50px -8px rgba(200, 80, 120, 0.3),
                        0 0 0 2px rgba(255, 255, 255, 0.7) inset,
                        0 10px 20px -5px rgba(255, 150, 180, 0.4);
            text-align: center;
            transition: transform 0.3s ease;
            animation: cardAppear 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardAppear {
            0% {
                opacity: 0;
                transform: scale(0.9) translateY(30px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* 頁面切換 */
        .page {
            display: none;
        }

        .page.active {
            display: block;
            animation: pageFade 0.6s ease;
        }

        @keyframes pageFade {
            0% {
                opacity: 0;
                transform: translateY(15px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 大標題 */
        .title {
            font-size: 2.2rem;
            font-weight: 700;
            color: #b3415c;
            letter-spacing: 2px;
            margin-bottom: 0.6rem;
            line-height: 1.4;
        }

        /* 大愛心 */
        .big-heart {
            font-size: 5rem;
            line-height: 1;
            margin: 0.8rem 0 0.5rem;
            filter: drop-shadow(0 8px 12px rgba(220, 80, 120, 0.4));
            animation: beat 1.4s ease-in-out infinite;
            user-select: none;
        }

        @keyframes beat {
            0%, 100% { transform: scale(1); }
            30% { transform: scale(1.15); }
            50% { transform: scale(1.05); }
            70% { transform: scale(1.12); }
        }

        /* 問題文字 */
        .question {
            font-size: 1.5rem;
            font-weight: 600;
            color: #6b3e4b;
            line-height: 1.7;
            margin: 1.5rem 0 2rem;
            letter-spacing: 1px;
        }

        .question .highlight {
            color: #c93e61;
            font-weight: 700;
            background: linear-gradient(120deg, #ffe2e9 0%, #ffe2e9 50%, transparent 90%);
            padding: 0 8px;
            border-radius: 20px;
        }

        /* 按鈕區塊 */
        .btn-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 0.5rem;
        }

        .btn {
            border: none;
            border-radius: 60px;
            padding: 1.1rem 2.2rem;
            font-size: 1.25rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            letter-spacing: 2px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: inherit;
            flex: 1;
            min-width: 140px;
        }

        /* 願意 / 會 按鈕 */
        .btn-yes {
            background: linear-gradient(135deg, #ff9eb5, #ff6b8f);
            color: white;
            box-shadow: 0 16px 28px -8px #ff8aa8, 0 0 0 2px rgba(255, 255, 255, 0.6) inset;
        }

        .btn-yes:hover {
            transform: scale(1.05);
            box-shadow: 0 20px 32px -6px #ff7a9e, 0 0 0 3px rgba(255, 255, 255, 0.8) inset;
            background: linear-gradient(135deg, #ff8fa8, #ff5a80);
        }

        .btn-yes:active {
            transform: scale(0.97);
        }

        /* 不願意 / 不會 按鈕 */
        .btn-no {
            background: rgba(255, 240, 245, 0.9);
            color: #b3415c;
            border: 2px solid #ffb6c8;
            box-shadow: 0 8px 16px -6px rgba(255, 150, 170, 0.4);
        }

        .btn-no:hover {
            background: #fff0f5;
            transform: scale(1.03);
            border-color: #ff8aa8;
        }

        .btn-no:active {
            transform: scale(0.97);
        }

        /* 結果畫面 */
        .result-card {
            text-align: center;
        }

        .result-title {
            font-size: 2rem;
            font-weight: 700;
            color: #b3415c;
            margin-bottom: 1.5rem;
            letter-spacing: 2px;
        }

        .result-list {
            list-style: none;
            text-align: left;
            display: inline-block;
            margin: 0 auto 1.8rem;
            padding: 0;
        }

        .result-list li {
            font-size: 1.3rem;
            color: #6b3e4b;
            padding: 1rem 1.5rem;
            margin-bottom: 1rem;
            background: rgba(255, 230, 240, 0.7);
            border-radius: 20px;
            border: 1px solid rgba(255, 180, 200, 0.8);
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 12px rgba(255, 150, 180, 0.2);
            min-width: 280px;
        }

        .result-list li .answer {
            font-weight: 700;
            color: #c93e61;
            margin-left: auto;
            font-size: 1.4rem;
        }

        .result-list li .icon {
            font-size: 1.5rem;
        }

        /* 最終訊息 */
        .final-message {
            font-size: 1.4rem;
            font-weight: 600;
            color: #c93e61;
            background: #fff0f3;
            border-radius: 50px;
            padding: 1.2rem 1.8rem;
            display: inline-block;
            box-shadow: 0 6px 18px rgba(255, 130, 160, 0.4);
            border: 1px solid #ffc1d0;
            line-height: 1.7;
            margin-top: 0.5rem;
            animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes popIn {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* 撒花愛心 */
        .confetti-heart {
            position: fixed;
            top: -50px;
            pointer-events: none;
            z-index: 999;
            animation: confettiFall linear forwards;
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(0) rotate(0deg) scale(0.8);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(720deg) scale(1.2);
                opacity: 0;
            }
        }

        /* 頁腳 */
        .footer-note {
            margin-top: 1.8rem;
            font-size: 0.85rem;
            color: #b98797;
            letter-spacing: 1px;
            border-top: 1px solid #ffd9e2;
            padding-top: 1.2rem;
        }

        /* 手機優化 */
        @media (max-width: 480px) {
            .card {
                padding: 2rem 1.3rem;
                border-radius: 36px;
            }
            .title {
                font-size: 1.8rem;
            }
            .big-heart {
                font-size: 3.8rem;
            }
            .question {
                font-size: 1.25rem;
            }
            .btn {
                font-size: 1.1rem;
                padding: 1rem 1.5rem;
                min-width: 120px;
            }
            .result-list li {
                font-size: 1.1rem;
                padding: 0.9rem 1.2rem;
                min-width: 240px;
            }
            .result-list li .answer {
                font-size: 1.2rem;
            }
            .result-title {
                font-size: 1.6rem;
            }
            .final-message {
                font-size: 1.15rem;
                padding: 1rem 1.3rem;
            }
        }
    </style>
</head>
<body>
    <!-- 飄浮愛心背景 -->
    <div class="heart-bg" id="heartBg"></div>

    <!-- 主卡片 -->
    <div class="card">

        <!-- 第一頁：告白問題 -->
        <div class="page active" id="page1">
            <div class="big-heart">💗</div>
            <div class="question">
                我喜歡你 ❤️<br>
                願意當我女朋友嗎？
            </div>
            <div class="btn-group">
                <button class="btn btn-yes" onclick="answerQ1('願意')">願意 💕</button>
                <button class="btn btn-no" onclick="answerQ1('不願意')">不願意</button>
            </div>
        </div>

        <!-- 第二頁：第二個問題 -->
        <div class="page" id="page2">
            <div class="big-heart">📚</div>
            <div class="question">
                以後考試還會不會努力？
            </div>
            <div class="btn-group">
                <button class="btn btn-yes" onclick="answerQ2('會')">會 💪</button>
                <button class="btn btn-no" onclick="answerQ2('不會')">不會</button>
            </div>
        </div>

        <!-- 第三頁：結果總結 -->
        <div class="page" id="page3">
            <div class="result-card">
                <div class="big-heart">🎉</div>
                <div class="result-title">你的選擇</div>
                <ul class="result-list">
                    <li>
                        <span class="icon">❤️</span>
                        願意當我女朋友嗎？
                        <span class="answer" id="resultQ1">—</span>
                    </li>
                    <li>
                        <span class="icon">📚</span>
                        以後考試還會不會努力？
                        <span class="answer" id="resultQ2">—</span>
                    </li>
                </ul>
                <div class="final-message" id="finalMsg"></div>
            </div>
        </div>

        <div class="footer-note">
            made with ❤️ 只為妳
        </div>
    </div>

    <script>
        // 儲存答案
        let answer1 = '';
        let answer2 = '';

        // 生成飄浮愛心背景
        (function createHearts() {
            const heartContainer = document.getElementById('heartBg');
            const heartSymbols = ['❤️', '💕', '💗', '💓', '💖', '🌸', '✨'];
            const heartCount = 28;

            for (let i = 0; i < heartCount; i++) {
                const span = document.createElement('span');
                span.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
                span.style.left = Math.random() * 100 + '%';
                const duration = 12 + Math.random() * 15;
                span.style.animationDuration = duration + 's';
                span.style.animationDelay = Math.random() * -20 + 's';
                const size = 1.2 + Math.random() * 2.2;
                span.style.fontSize = size + 'rem';
                span.style.opacity = 0.15 + Math.random() * 0.4;
                heartContainer.appendChild(span);
            }
        })();

        // 切換頁面
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }

        // 回答第一題
        function answerQ1(answer) {
            answer1 = answer;
            if (answer === '願意') {
                // 願意 → 進入第二題
                showPage('page2');
            } else {
                // 不願意 → 直接跳到結果頁
                answer2 = '未回答';
                showResult();
            }
        }

        // 回答第二題
        function answerQ2(answer) {
            answer2 = answer;
            showResult();
        }

        // 顯示結果
        function showResult() {
            // 填入答案
            document.getElementById('resultQ1').textContent = answer1;
            document.getElementById('resultQ2').textContent = answer2;

            // 根據答案顯示最終訊息
            const finalMsg = document.getElementById('finalMsg');

            if (answer1 === '願意' && answer2 === '會') {
                finalMsg.innerHTML = '💖 太棒了！我會一直陪著妳，<br>一起努力、一起成長！我愛妳！ 💖';
                // 撒花
                createConfetti();
            } else if (answer1 === '願意' && answer2 === '不會') {
                finalMsg.innerHTML = '😊 沒關係，願意就好～<br>以後我陪妳一起努力！ ❤️';
                createConfetti();
            } else if (answer1 === '不願意') {
                finalMsg.innerHTML = '🥺 沒關係，我還是會一直喜歡妳。<br>希望有一天能打動妳的心。 💕';
            } else {
                finalMsg.innerHTML = '❤️ 謝謝妳的答案！';
            }

            showPage('page3');
        }

        // 撒花效果
        function createConfetti() {
            const symbols = ['❤️', '💖', '💕', '💗', '✨', '🌸', '💝'];
            for (let i = 0; i < 40; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.classList.add('confetti-heart');
                    heart.textContent = symbols[Math.floor(Math.random() * symbols.length)];
                    heart.style.left = Math.random() * 100 + '%';
                    heart.style.fontSize = (1.2 + Math.random() * 2) + 'rem';
                    const duration = 2.5 + Math.random() * 2.5;
                    heart.style.animationDuration = duration + 's';
                    document.body.appendChild(heart);

                    // 動畫結束後移除
                    setTimeout(() => {
                        heart.remove();
                    }, duration * 1000);
                }, i * 80);
            }
        }
    </script>
</body>
</html>
